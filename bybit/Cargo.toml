[package]
name = "bybit"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/bybit.rs"

[dependencies]
model = { path = "../model" }
chrono = "0.4.42"
tokio = "1.48"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tungstenite = "0.28.0"
futures-util = "0.3.31"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rust_decimal = "1.39"
reqwest = "0.12"
